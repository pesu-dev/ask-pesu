# Shared tooling configuration for the ask-pesu monorepo.
#
# Runtime dependencies live in each service's own pyproject.toml
# (services/api, services/db). This file deliberately declares no [project]
# table: it exists so that ruff and pytest resolve a single configuration for
# every service. Ruff walks up from each file to the nearest pyproject.toml
# containing a [tool.ruff] table, so the service pyprojects -- which have none --
# correctly resolve to this one.

[tool.pytest.ini_options]
pythonpath = ["services/api"]
markers = [
    "secret_required: marks tests that require secrets or environment variables (e.g. HF_TOKEN).",
]

[tool.ruff.lint]
select = [
    "E", # Pycodestyle errors
    "F", # Pyflakes errors
    "W", # Pycodestyle warnings
    "UP", # Pyupgrade rules
    "I", # Import related rules
    "C90", # Complexity rules
    "D", # Documentation rules
    "ANN", # Annotations rules
    "TYP", # Type checking rules
    "N", # Naming rules
    "Q000", # Quotation style rules
    "RET", # Return type rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# The db service predates this lint configuration. Bringing it up to standard is
# a follow-up; keeping the monorepo move itself free of source changes matters
# more. Delete this entry once services/db is annotated and documented.
"services/db/**" = ["D", "ANN"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "tests/",
    "node_modules/"
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
