# Shared tooling configuration for the ask-pesu monorepo.
#
# Runtime dependencies live in each service's own pyproject.toml
# (services/api, services/db). This file deliberately declares no [project]
# table: it exists so that ruff and pytest resolve a single configuration for
# every service. Ruff walks up from each file to the nearest pyproject.toml
# containing a [tool.ruff] table, so the service pyprojects -- which have none --
# correctly resolve to this one.

[tool.ruff.lint]
select = [
    "E", # Pycodestyle errors
    "F", # Pyflakes errors
    "W", # Pycodestyle warnings
    "UP", # Pyupgrade rules
    "I", # Import related rules
    "C90", # Complexity rules
    "D", # Documentation rules
    "ANN", # Annotations rules
    "TYP", # Type checking rules
    "N", # Naming rules
    "Q000", # Quotation style rules
    "RET", # Return type rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are run by pytest, not consumed as an API: requiring a docstring and
# annotations on every case and fixture adds noise without adding safety. They
# are otherwise linted and formatted like the rest of the repo.
"tests/**" = ["D", "ANN"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "node_modules/"
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
