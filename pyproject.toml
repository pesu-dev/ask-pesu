# Shared configuration for the ask-pesu monorepo.
#
# One [project] table covers both services: what they share is the base
# `dependencies`, and what only one needs is an extra. Neither Dockerfile
# installs from this file -- both `pip install -r requirements.txt` -- so it
# never has to reach a Space. It is the *source* that one root requirements.txt
# is compiled from:
#
#     uv pip compile pyproject.toml --extra api --extra db --group cpu \
#         --python-platform linux --python-version 3.12 -o requirements.txt
#
# `--group cpu` is not optional. It is what puts torch in the file at all, and
# therefore what selects the +cpu build; compiling without it resolves torch
# transitively from PyPI and adds roughly 4 GB of CUDA libraries to both images.
# CI recompiles with exactly this command and fails on any difference.
#
# Both extras go into that single file, so each image installs the union and
# carries a little it does not import. That is deliberate: it resolves the
# embedding stack exactly once, which makes it impossible for the writer and the
# reader to end up on different versions of the library that produces the
# vectors. The platform and version are pinned so the file a laptop generates is
# the file the linux/amd64 Space installs.
#
# It also gives ruff one configuration for every service: ruff walks up from
# each file to the nearest pyproject.toml containing [tool.ruff], and this is
# the only pyproject.toml in the repo.

[project]
name = "ask-pesu"
version = "0.1.0"
description = "Retrieval-augmented question answering for PES University, from r/PESU discussions."
readme = "README.md"
requires-python = ">=3.12"

# Needed by BOTH services. The embedding stack especially must stay identical:
# services/db writes the vectors services/api reads, so a version split here is
# the same class of silent mismatch that conf/collection.yaml exists to prevent.
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "langchain-core>=1.2.19",
    "langchain-huggingface>=1.2.1",
    "langchain-qdrant>=1.1.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=5.1.0",
    # torch is not here. It arrives with sentence-transformers, and which BUILD
    # of it arrives has to be selectable, so it is declared in the `cpu` and
    # `gpu` dependency groups below instead.
]

[project.optional-dependencies]
# The reader: HTTP surface, multi-query retrieval, HF Inference.
api = [
    "pydantic>=2.11.7",
    "pytz>=2025.2",
    "langchain-classic>=1.0.3",
    "huggingface-hub>=1.30.0",
]
# The writer: Reddit ingestion, and the BM25 sparse embeddings the collection's
# `sparse` vector needs. fastembed pulls onnxruntime, which is why the db image
# is the larger of the two.
db = [
    "anytree>=2.13.0",
    "fastembed>=0.8.0",
    "praw>=7.8.1",
]

# Dependency groups rather than extras, because uv installs these by default and
# `pip` cannot see them at all -- which is exactly the split wanted here. A
# contributor running `uv sync` gets the linting tools and a CPU torch with no
# extra flags, while requirements.txt is compiled from the extras plus
# `--group cpu` and never carries `dev` or `gpu` into a Space.
[dependency-groups]
# The local toolchain. ruff is pinned to the exact version
# .pre-commit-config.yaml runs, so `uv run ruff check .` and CI cannot disagree
# about which rules exist.
dev = [
    "pre-commit>=4.3.0",
    "ruff==0.12.12",
]

# torch, declared twice, resolved from two different indexes. Neither service
# imports it directly -- sentence-transformers does -- but it is named here
# because [tool.uv.sources] redirects DIRECT dependencies only; left to resolve
# on its own it comes from PyPI as the CUDA build.
#
# `cpu` is the default, and is what requirements.txt and both Spaces are built
# from. `gpu` exists for the backfill, which is roughly 270x faster on a GPU:
#
#     uv sync --extra api --extra db --no-group cpu --group gpu
#
# Both resolve the same torch VERSION and differ only in the build, so moving a
# machine to CUDA cannot quietly change the library that produces the vectors.
cpu = [
    "torch>=2.10.0",
]
gpu = [
    "torch>=2.10.0",
]

[tool.uv]
# There is no importable `ask_pesu` package at the root. This table describes
# dependencies; it is not something to build or install.
package = false

# One torch or the other, never both. Declaring the conflict is what allows the
# two groups above to name the same package from different indexes -- uv refuses
# to lock without it. It also makes `--group gpu` on its own fail with an error
# naming the pair, instead of installing the CPU build anyway.
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

# `dev` and `cpu` need no flag, which is what makes a plain `uv sync` the
# correct and only local install.
default-groups = [
    "dev",
    "cpu",
]

# torch resolves from PyTorch's CPU index. Both Spaces run on CPU, and the CUDA
# wheels were ~4 GB of image for libraries that are never loaded. `explicit`
# keeps this index used ONLY for torch, so nothing else resolves against it.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# The CUDA index the `gpu` group resolves against. This URL is the single place
# that decides which CUDA release a GPU install targets -- change it here to
# match a different driver, rather than installing torch by hand.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "gpu" },
]

[tool.ruff.lint]
select = [
    "E", # Pycodestyle errors
    "F", # Pyflakes errors
    "W", # Pycodestyle warnings
    "UP", # Pyupgrade rules
    "I", # Import related rules
    "C90", # Complexity rules
    "D", # Documentation rules
    "ANN", # Annotations rules
    "TYP", # Type checking rules
    "N", # Naming rules
    "Q000", # Quotation style rules
    "RET", # Return type rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "node_modules/"
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
