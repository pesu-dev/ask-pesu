name: Deploy DB Service

# The db service has a single environment (no staging Space), so this stays a
# manual deploy from the integration branch, matching how ask-pesu-db behaved
# before the monorepo migration.
on:
  workflow_dispatch:

jobs:
  deploy-db:
    runs-on: ubuntu-latest
    if: ${{ contains(fromJson(vars.PROD_DEPLOYMENT_ALLOWED_USERS), github.actor) }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: dev

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The Space expects the db service at its root, so push only that
      # subtree. `git subtree split` needs full history, hence fetch-depth: 0.
      - name: Push DB subtree to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git subtree split --prefix=services/db HEAD -b deploy-db
          git push https://pesu-dev:$HF_TOKEN@huggingface.co/spaces/pesu-dev/askpesu-db deploy-db:main --force
