name: Frontend Checks

# `vite build` strips TypeScript types rather than checking them, so a type
# error compiles and fails in the browser. This typechecks and runs the tests.
#
# Two tsconfig projects: tsconfig.app.json covers src/, tsconfig.node.json
# covers vite.config.ts. The root tsconfig.json only references them, so
# checking it alone would check neither.
#
# Path-filtered, so it does not run on a PR that leaves the frontend alone. Do
# not make it a required status check: GitHub would wait on those PRs forever.
on:
  push:
    paths: [ "services/api/frontend/**", ".github/workflows/frontend.yaml" ]
  pull_request:
    paths: [ "services/api/frontend/**", ".github/workflows/frontend.yaml" ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The version the api image builds the frontend with.
          node-version: 24
          cache: npm
          cache-dependency-path: services/api/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
