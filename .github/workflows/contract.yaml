name: Contract Checks

# services/db writes the Qdrant collection and services/api reads it. The
# agreement between them is authored once, at conf/collection.yaml.
#
# That file lives at the repo root, but each service is deployed with
# `git subtree split --prefix=services/<name>`, which ships only that
# directory. Deploys and image builds therefore vendor it into the service
# tree. These checks make sure it stays a single authored file and that the
# vendoring actually lands in the tree that gets deployed.
on: [ push, pull_request ]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: There is exactly one authored contract
        run: |
          found=$(git ls-files '*collection.yaml')
          echo "tracked: $found"
          [ "$found" = "conf/collection.yaml" ] \
            || { echo "::error::expected only conf/collection.yaml to be tracked"; exit 1; }

      - name: Deploy vendoring puts the contract in each Space tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for svc in api db; do
            mkdir -p "services/$svc/conf"
            cp conf/collection.yaml "services/$svc/conf/collection.yaml"
            git add -f "services/$svc/conf/collection.yaml"
          done
          git commit -q -m "Vendor conf/collection.yaml for deployment"
          for svc in api db; do
            git subtree split --prefix="services/$svc" HEAD -b "verify-$svc" >/dev/null
            git cat-file -e "verify-$svc:conf/collection.yaml" \
              && echo "✅ services/$svc Space tree ships conf/collection.yaml" \
              || { echo "::error::services/$svc would deploy without the contract"; exit 1; }
          done
