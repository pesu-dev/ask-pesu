name: Deploy to Staging

on:
  workflow_run:
    workflows: [ "Docker Container Build" ]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'dev') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/dev')
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: dev

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # services/api/ becomes the Space's repository root, so the shared contract
      # -- authored once at conf/collection.yaml -- has to be inside the service
      # tree before the split. This commit is local to the runner and is never
      # pushed to GitHub.
      - name: Vendor the shared contract into the service tree
        run: |
          mkdir -p services/api/conf
          cp conf/collection.yaml services/api/conf/collection.yaml
          git add -f services/api/conf/collection.yaml
          git commit -q -m "Vendor conf/collection.yaml for deployment"

      # The Space expects the API service at its root, so push only that
      # subtree. `git subtree split` needs full history, hence fetch-depth: 0.
      - name: Push API subtree to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git subtree split --prefix=services/api HEAD -b deploy-api
          git cat-file -e deploy-api:conf/collection.yaml \
            || { echo "::error::deploy tree is missing conf/collection.yaml"; exit 1; }
          git push https://pesu-dev:$HF_TOKEN@huggingface.co/spaces/pesu-dev/askpesu-dev deploy-api:main --force
