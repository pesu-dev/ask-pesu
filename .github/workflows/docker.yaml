# Builds both service images and boots each one to check it serves /health.
#
# Nothing depends on this workflow's name any more: deploy-staging.yaml used to
# chain off it via `workflow_run` and has been replaced by deploy-dev.yaml,
# which triggers directly on pushes to `dev`. The name is free to change.
name: Docker Container Build

on:
  workflow_run:
    workflows: [ "Pre-Commit Checks" ]
    types:
      - completed
  # The workflow_run chain above has never actually fired: its head_branch guard
  # does not match, because the Pre-Commit Checks runs that succeed are on fork
  # PR branches. Manual dispatch is therefore the only way these container
  # builds run at all -- and nothing downstream depends on them now that
  # deploy-dev.yaml triggers directly on pushes to `dev`.
  #
  # If these smoke tests should run on every merge, replace the workflow_run
  # trigger with `push: branches: [ dev ]`. That is a deliberate change to when
  # CI spends time, so it is left as a decision rather than made here.
  workflow_dispatch:

jobs:
  build-api:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev')
    steps:
      - uses: actions/checkout@v4
      - name: Get short commit hash
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # The build context is services/api, which does not contain the shared
      # contract -- it is authored once at conf/collection.yaml.
      - name: Vendor the shared contract into the build context
        run: |
          mkdir -p services/api/conf
          cp conf/collection.yaml services/api/conf/collection.yaml
      - name: Build the Docker image
        run: docker build services/api --tag ask-pesu
      - name: Spawn a container
        run: |
          docker run --name ask-pesu -d -p 7860:7860 \
            -e QDRANT_API_KEY="${{ secrets.QDRANT_API_KEY }}" \
            -e QDRANT_URL="${{ secrets.QDRANT_URL }}" \
            -e QDRANT_COLLECTION="${{ vars.QDRANT_COLLECTION_DEV || 'ask-pesu-dev' }}" \
            -e HF_TOKEN="${{ secrets.HF_TOKEN }}" \
            ask-pesu
      - name: Wait for the container to be ready
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:7860/health > /dev/null; then
              echo "✅ Service is up!"
              exit 0
            fi
            echo "⏳ Waiting for service..."
            sleep 15
          done
          echo "❌ Service did not start in time."
          docker logs ask-pesu
          exit 1
      - name: Stop the container
        if: always()
        run: docker stop ask-pesu

  build-db:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev')
    steps:
      - uses: actions/checkout@v4
      - name: Get short commit hash
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # The build context is services/db, which does not contain the shared
      # contract -- it is authored once at conf/collection.yaml.
      - name: Vendor the shared contract into the build context
        run: |
          mkdir -p services/db/conf
          cp conf/collection.yaml services/db/conf/collection.yaml
      - name: Build the Docker image
        run: docker build services/db --tag ask-pesu-db
      - name: Run container
        run: |
          docker run --name ask-pesu-db -d -p 7860:7860 \
            -e REDDIT_CLIENT_ID="${{ secrets.REDDIT_CLIENT_ID }}" \
            -e REDDIT_CLIENT_SECRET="${{ secrets.REDDIT_CLIENT_SECRET }}" \
            -e QDRANT_URL="${{ secrets.QDRANT_URL }}" \
            -e QDRANT_API_KEY="${{ secrets.QDRANT_API_KEY }}" \
            -e QDRANT_COLLECTION="${{ vars.QDRANT_COLLECTION_DEV || 'ask-pesu-dev' }}" \
            ask-pesu-db
      - name: Wait for the container to be ready
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:7860/health > /dev/null; then
              echo "✅ Service is up!"
              exit 0
            fi
            echo "⏳ Waiting for service..."
            sleep 15
          done
          echo "❌ Service did not start in time."
          docker logs ask-pesu-db
          exit 1
      - name: Stop container
        if: always()
        run: docker stop ask-pesu-db
      - name: Remove container
        if: always()
        run: docker rm ask-pesu-db
