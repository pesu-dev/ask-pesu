name: Deploy to Dev

# Every merge into `dev` deploys the api to its dev Space.
#
# The db is deliberately not here. There is one db Space, and it is the one that
# writes the live index, so it must never run code that has not been through the
# production gate -- it deploys from `main` only, in deploy-prod.yaml. The
# practical consequence, worth knowing before you rely on it: a change to
# services/db merged into `dev` is not running anywhere until someone dispatches
# a production deploy. Test writer changes locally against the ask-pesu-dev
# collection.
#
# The trigger is `on: push` rather than a `workflow_run` chain off the CI
# workflows, because a chained trigger only fires for runs whose head branch is
# `dev`, and pull request CI runs on the fork's branch instead. Nothing gates
# this deploy: dev is disposable, and a failure there is the signal.
on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git subtree split` walks the whole history.
          fetch-depth: 0
          # Pinned rather than defaulted, so a workflow_dispatch from some other
          # branch still deploys dev instead of shipping that branch.
          ref: dev

      - uses: ./.github/actions/deploy-space
        with:
          service: api
          space: pesu-dev/askpesu-dev
          hf-token: ${{ secrets.HF_TOKEN }}
