name: Deploy to Dev

# Every merge into `dev` deploys both services.
#
# READ THIS BEFORE CHANGING THE MATRIX. The db target below is `askpesu-db`,
# with no `-dev` suffix, and that is not a mistake: the free tier allows three
# CPU Spaces, spent on two api environments and ONE writer. There is no dev db
# Space to deploy to. Merging to `dev` therefore updates the writer that fills
# the collection production reads.
#
# That is deliberate. The alternative -- deploying the db only from `main` --
# looks safer and is not: with no dev writer, a db change merged to `dev` runs
# nowhere, so the promotion gate is reached having observed nothing about it.
# Deploying here means a writer change is live where it can be watched, and a
# revert on `dev` takes effect the same way it arrived. What contains a bad
# writer is not the delay, it is the contract: a payload whose keys drift stops
# the listener and turns /health into a 503, and a wrong model, geometry or
# credential aborts startup before anything is written.
#
# The api deploys to its own dev Space and is unaffected by any of this.
#
# The trigger is `on: push` rather than a `workflow_run` chain off the CI
# workflows, because a chained trigger only fires for runs whose head branch is
# `dev`, and pull request CI runs on the fork's branch instead.
on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      # One service failing must not cancel the other's deploy -- they are
      # independent Spaces.
      fail-fast: false
      matrix:
        include:
          - service: api
            space: pesu-dev/askpesu-dev
          - service: db
            space: pesu-dev/askpesu-db     # the only db Space; see the note above
    steps:
      - uses: actions/checkout@v4
        with:
          # `git subtree split` walks the whole history.
          fetch-depth: 0
          # Pinned rather than defaulted, so a workflow_dispatch from some other
          # branch still deploys dev instead of shipping that branch.
          ref: dev

      - uses: ./.github/actions/deploy-space
        with:
          service: ${{ matrix.service }}
          space: ${{ matrix.space }}
          hf-token: ${{ secrets.HF_TOKEN }}
