name: Deploy to Production

# Promotion is deliberately manual: a human decides that what has been running
# on dev is ready. The workflow fast-forwards `main` to `dev` and then deploys
# BOTH services to their production Spaces.
#
# This is the ONLY place the db is deployed. There is one db Space, and it writes
# the collection every reader answers from, so it moves here and nowhere else.
#
# The alternative -- deploying it on merges to `dev` as well -- was rejected on
# cadence. Merges to `dev` are frequent and touch shared files like conf/ and
# requirements.txt that the db image consumes, so the writer would be restarted
# often; and because its stream opens with skip_existing=True, every restart
# permanently drops the r/PESU comments posted while it was down. Promotions are
# infrequent and deliberate, which is the right rhythm for a component whose
# restarts cost data. The cost accepted in exchange is real and documented in the
# README: a services/db change merged to `dev` runs nowhere until someone
# promotes, so writer changes reach production unobserved.
#
# Neither deploy job is path-filtered. A promotion should put `main` on every
# production Space regardless of what changed -- that is what makes "the
# production Spaces run main" true unconditionally rather than most of the time.
#
# It does NOT redeploy the dev api Space. That tracks `dev`, and re-pushing
# `main` over it would silently roll dev back whenever dev is ahead of main --
# which it is as soon as the next pull request merges. Every deploy here is a
# force push, so nothing would object.
on:
  workflow_dispatch:

jobs:
  # Fast-forward main to dev. The --ff-only is the safety property of the whole
  # promote: if the branches have diverged, this stops rather than inventing a
  # merge nobody reviewed.
  sync-dev-to-main:
    runs-on: ubuntu-latest
    if: ${{ contains(fromJson(vars.PROD_DEPLOYMENT_ALLOWED_USERS), github.actor) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: |
          git fetch origin dev
          git fetch origin main

      - name: Checkout main branch
        run: git checkout main

      - name: Merge dev into main
        run: |
          git merge --ff-only origin/dev || {
            echo "❌ Fast-forward merge failed. Manual conflict resolution required."
            echo "Please ensure dev branch is ahead of main with no conflicts."
            git merge --abort
            exit 1
          }

      - name: Push updated main branch
        run: git push origin main

  deploy-production:
    runs-on: ubuntu-latest
    needs: [ sync-dev-to-main ]
    if: ${{ contains(fromJson(vars.PROD_DEPLOYMENT_ALLOWED_USERS), github.actor) }}
    strategy:
      # A failed api deploy must not cancel the db deploy, or production is left
      # with the two services on different commits and no record of which.
      fail-fast: false
      matrix:
        include:
          - service: api
            space: pesu-dev/askpesu
          - service: db
            space: pesu-dev/askpesu-db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Fetched fresh, so this is the main that sync-dev-to-main just pushed.
          ref: main

      - uses: ./.github/actions/deploy-space
        with:
          service: ${{ matrix.service }}
          space: ${{ matrix.space }}
          hf-token: ${{ secrets.HF_TOKEN }}

      - name: Deployment summary
        run: |
          echo "✅ dev → main fast-forwarded"
          echo "✅ services/${{ matrix.service }} → ${{ matrix.space }}"
