name: Deploy API to Dev

# Deploys services/api to its dev Space on merges that could change it.
#
# The api is the ONLY service deployed from `dev`. The db is not here: there is
# one db Space and it writes the collection production serves from, so it moves
# only on a production promotion. See deploy-prod.yaml.
#
# Path-filtered so a merge that cannot change this Space does not rebuild a ~3 GB
# image for nothing. The list is deliberately generous -- an unnecessary deploy
# costs a rebuild, a missing one means someone merges and nothing happens, with
# nothing to say why. Everything the Space actually receives is covered: this
# service's own directory, plus the four root files vendored into the tree and
# the composite action that vendors them. Files that never reach the Space --
# the root README, pyproject.toml, uv.lock -- are deliberately absent.
on:
  push:
    branches: [ dev ]
    paths:
      - 'services/api/**'
      - 'conf/**'                             # the contract, vendored into the tree
      - 'requirements.txt'                    # what the image installs
      - 'LICENSE'                             # vendored
      - '.env.example'                        # vendored
      - '.github/actions/deploy-space/**'     # the deploy mechanism itself
      - '.github/workflows/deploy-dev-api.yaml'
  workflow_dispatch:                          # ignores paths; use it to force a deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                      # `git subtree split` walks the whole history
          ref: dev                            # so a dispatch from another branch still ships dev

      - uses: ./.github/actions/deploy-space
        with:
          service: api
          space: pesu-dev/askpesu-dev
          hf-token: ${{ secrets.HF_TOKEN }}
