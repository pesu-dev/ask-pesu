# Runtime configuration for services/api. Everything here can be changed without
# touching the collection, and takes effect on the next restart.
#
# NOTE: the embedding model and the Qdrant collection name are NOT configured
# here. They are half of the writer/reader contract shared with services/db and
# live in conf/collection.yaml, which is enforced at startup. Anything that
# would make already-stored vectors unreadable belongs there, not here.

rag:
  llm:
    # Two models, both reached through Hugging Face Inference. `provider` routes
    # the call to a third-party host rather than HF's own hardware.
    #
    # `primary` answers in normal mode AND does every retrieval-side LLM call in
    # both modes -- question rewriting and multi-query expansion -- so thinking
    # tokens are never spent on reformulating a question.
    #
    # `thinking` only ever writes the final answer, and emits its reasoning
    # inside <think>...</think>, which the backend splits out into `step` events.
    #
    # temperature: low, because answers must stay close to the retrieved threads.
    # max_new_tokens: the answer budget; a thinking model spends part of it on
    #   reasoning, so truncation shows up there first.
    # timeout: seconds to wait on the provider before failing the stream.

    primary:
      repo_id: "Qwen/Qwen3-4B-Instruct-2507"
      provider: "nscale"
      temperature: 0.3
      max_new_tokens: 2048
      timeout: 120

    thinking:
      repo_id: "Qwen/Qwen3-4B-Thinking-2507"
      provider: "nscale"
      temperature: 0.3
      max_new_tokens: 2048
      timeout: 120
  # Retrieval is a RECALL stage: its job is to put the right document somewhere
  # in the candidate pool, not to rank it. Relevance is decided by the reranker
  # below, which is the only thing that filters.
  retrieval:
    # dense  -- vector search alone.
    # hybrid -- vector search AND the BM25 sparse vector every point already
    #           carries, fused by Qdrant with Reciprocal Rank Fusion.
    #
    # Measured on 2026-09-08 over 43,370 points (scripts/eval_retrieval.py):
    # the two are a wash on plain-English questions (MRR 0.472 dense, 0.497
    # hybrid) and hybrid is clearly ahead when the question uses the words the
    # corpus uses -- CSE, PESSAT, T1, SGPA, capstone -- where MRR goes 0.353 to
    # 0.507. Those literal tokens are unreachable by paraphrase, which is
    # exactly what a lexical index is for.
    mode: hybrid
    # Documents per phrasing, and the ONLY control on how large the candidate
    # pool gets. The multi-query step writes 3 phrasings and the original query
    # is searched too, so 4 searches run and the pool is at most 4 x k before
    # deduplication -- up to 60 at this setting.
    #
    # The searches are concurrent (MultiQueryRetriever gathers them), so `k`
    # costs almost nothing in network time. What it does buy is cross-encoder
    # work, which is paid in full before the first token reaches the user.
    # Measured on two CPU threads, which approximates a cpu-basic Space:
    #
    #     pool   time
    #       24   1.01s
    #       30   1.31s
    #       45   1.94s
    #       60   2.62s
    #
    # About 43 ms per document, linear. This machine is faster than a Space's
    # shared vCPUs, so treat those as a floor. Nothing downstream caps the pool,
    # which is deliberate -- one knob, and it is this one.
    k: 15
    # Minimum relevance, applied to the normalised cosine score. DENSE ONLY, and
    # it must be null under hybrid: Reciprocal Rank Fusion returns scores around
    # 0.02, so any value that looks reasonable for a cosine similarity would
    # discard every document. Startup refuses the combination rather than
    # letting it silently return nothing.
    #
    # NOTE this replaces `search_kwargs.score_threshold`, which never filtered
    # anything -- see the migration error in app/rag.py.
    score_threshold: null

  rerank:
    # A cross-encoder re-scores the shortlist by reading query and document
    # together, which a vector search cannot do. Disabling it removes the
    # sentence-transformers and torch load at startup and falls back to ranking
    # by retrieval score alone -- faster to boot, noticeably worse ordering, and
    # not allowed under hybrid, where the retrieval score is an RRF rank
    # artefact and nothing would be filtering relevance at all.
    enabled: true
    # The canonical repo id. `ms-marco-MiniLM-L-6-v2`, with the hyphen before the
    # 6, is a legacy alias that Hugging Face answers with a 307 to this one -- it
    # works, but every file lookup at startup pays a redirect.
    model: "cross-encoder/ms-marco-MiniLM-L6-v2"
    # THE relevance cutoff, on the cross-encoder's own 0..1 sigmoid scale, and
    # the only place anything is discarded for being a poor answer. Applied
    # BEFORE the ranking weights below, so a document is admitted on relevance
    # alone and only then reordered.
    #
    # Deliberately permissive. Raising it looks tempting and does not pay.
    #
    # Measured against the labelled questions in scripts/eval_retrieval.py, the score distributions of known-
    # correct documents and of everything else retrieved overlap heavily
    # (medians 0.97 and 0.76), so a higher gate discards right answers about as
    # fast as wrong ones:
    #
    #     threshold   correct kept   others kept
    #          0.30            92%           70%
    #          0.70            85%           53%
    #          0.90            73%           40%
    #          0.98            37%           25%
    #
    # And "others" overstates the error, because several threads legitimately
    # answer the same question and only one of them is labelled. So this model
    # discriminates too weakly on this corpus to be a sharp filter: its job is
    # to drop the obviously irrelevant tail, and `ranking` below decides the
    # order of what survives.
    score_threshold: 0.3
    # Documents that actually reach the answer prompt.
    top_n: 6

  # Applied AFTER the relevance cutoff, so this reorders documents that already
  # answer the question and can never promote one that does not.
  #
  # The multiplier is `1 - w + w*community`, bounded in [1-w, 1] -- a pure
  # penalty that cannot lift anything above its own relevance.
  #
  # There is deliberately no recency term. Ordering this corpus by age is close
  # to backwards: r/PESU directs repeated questions to existing threads, so its
  # most-referenced answers are old on purpose -- one contributor alone wrote
  # 1,776 root comments, 3.8% of every document in the collection, at a median
  # score of 5 against a corpus median of 2. Demoting that by age loses exactly
  # what the community treats as canonical.
  ranking:
    # How much the ANSWER's own score decides the order. This is the primary
    # ranking signal, and it is meant to lead rather than nudge: the
    # cross-encoder separates the documents reaching the prompt by only a few
    # percent, so it filters well and ranks poorly, and something else has to
    # choose between the survivors. Community endorsement is what "verified"
    # means on a subreddit that redirects repeated questions to existing
    # threads.
    #
    # Read from `root_comment_score`, not `score`. The latter is the
    # SUBMISSION's, identical across every document from one post, so it
    # cannot rank one reply above another.
    community_weight: 0.30

    # Score at which the term above saturates. Tuned for COMMENT scores, whose
    # median is 2 and 90th percentile 12 -- an order of magnitude below post
    # scores, so a value picked for those would leave almost every answer
    # indistinguishable near zero.
    reference_score: 25

  # The three prompts the pipeline uses. `{question}`, `{context}`, `{input}` and
  # `{chat_history}` are filled in by app/rag.py; renaming one breaks the chain.
  prompts:
    system_prompt: |
      You are askPESU, a helpful assistant developed by the PESU Dev team that helps users find information about PES University.
      You must answer using knowledge only from the r/PESU subreddit, which will be provided to you as context.
      Always answer accurately, comprehensively and in depth, based on the context, optionally formatted in markdown.

      Do NOT end with a list of sources or links. The threads you were given are reported to the user
      separately and exactly; repeating them wastes your response and risks citing a link you were never shown.

      If the context does not contain the answer, respond with "I'm sorry, I don't have that information."
      If asked anything unrelated to PES University, politely decline.
    answer_prompt: |
      Question: {question}
      Context: {context}
      Answer:
    rewrite_prompt: |
      You are a question rewriting assistant for PES University (PESU). Your job is to rewrite the user's question into an independent, self-contained question that is optimised for document retrieval.

      PESU domain knowledge to apply when rewriting:
      - Campuses: RR = Ring Road campus (Banashankari), EC = Electronic City campus
      - Branches: CSE = Computer Science Engineering, ECE = Electronics & Communication Engineering,
        EEE = Electrical & Electronics Engineering, ME = Mechanical Engineering, CV = Civil Engineering,
        AIML = Artificial Intelligence & Machine Learning, BT = Biotechnology
      - Admission routes: KCET, JEE Mains, management quota
      - Grading: SGPA (semester GPA), CGPA (cumulative GPA)
      - Expand any other abbreviations including the above when they appear in the question.

      CRITICAL: expand an abbreviation ALONGSIDE the original, never in place of it.
      Write "CSE (Computer Science Engineering)", not "Computer Science Engineering".
      Retrieval searches a lexical index as well as a semantic one, and the threads themselves
      say "CSE" -- replacing the abbreviation deletes the exact token that matches them.

      Rewrite rules:
      1. ONLY use the chat history if the user's question is ambiguous or refers to previous context (e.g., pronouns like 'he', 'she', 'it', 'they', 'that').
      2. If the question is clear on its own, return it EXACTLY as it is (still expanding any PESU abbreviations).
      3. When resolving a follow-up question, ALWAYS prioritize the most recent topic in the chat history. Do NOT pull context from older, unrelated parts of the conversation.
      4. If the question could refer to multiple topics, choose the MOST RECENT plausible topic.
      5. Do NOT invent or assume connections between unrelated topics.
      6. Do NOT answer the question - only rewrite it.

      Chat History:
      {chat_history}
