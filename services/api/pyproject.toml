[project]
name = "ask-pesu"
version = "0.1.0"
description = "A FastAPI application for question answering about PES University using LangChain and Qdrant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.7",
    "pytz>=2025.2",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "torch>=2.10.0",
    "sentence-transformers>=5.1.0",
    "langchain-core>=1.2.19",
    "langchain-classic>=1.0.3",
    "langchain-huggingface>=1.2.1",
    "langchain-qdrant>=1.1.0",
    "qdrant-client>=1.9.0",
    "huggingface-hub>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.12.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
