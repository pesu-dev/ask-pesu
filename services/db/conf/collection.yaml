# ---------------------------------------------------------------------------
# Shared Qdrant collection contract.
#
# services/db WRITES this collection; services/api READS it. Both must agree on
# every value below -- a mismatch in the embedding model or vector dimensions
# corrupts retrieval silently, and a mismatch in vector naming fails hard at API
# startup. Change it here, once, rather than in either service alone.
#
# This file is the authored source. Each service is deployed as a
# `git subtree split`, which ships only services/<name>/, so the copies under
# services/*/conf/ are what actually run. They are generated -- edit this file
# and run `python scripts/sync_contract.py`.
#
# The loader and the startup checks live in conf/contract.py, and are propagated
# the same way.

collection:
  name: "ask-pesu"

  dense:
    model: "Alibaba-NLP/gte-modernbert-base"
    size: 768
    distance: "Cosine"
    # Empty string is langchain_qdrant's VECTOR_NAME default (the unnamed vector).
    vector_name: ""

  # Payload keys written by services/db on every point, enforced exactly: the
  # writer refuses to upsert a payload whose key set differs from this list, and
  # the reader refuses to start if a key it consumes is missing from it.
  #
  # `url` is what services/api cites today; `permalink` is the more reliable
  # target, since `url` points outward for link posts.
  metadata:
    - root_comment_id
    - post_id
    - author
    - url
    - permalink
    - score
    - upvote_ratio
    - created_utc
    - flair
    - nsfw
