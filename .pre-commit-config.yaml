exclude: node_modules/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.7
    hooks:
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix ]
        types_or: [ python, pyi, jupyter ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: name-tests-test
        args: [ '--pytest-test-first' ]

  # Runs last, so it propagates whatever the formatting hooks above produced.
  # The contract is vendored into each service because `git subtree split` ships
  # only services/<name>/; this is what stops the copies from drifting.
  - repo: local
    hooks:
      - id: sync-contract
        name: sync collection contract into service subtrees
        entry: python scripts/sync_contract.py
        language: system
        pass_filenames: false
        files: ^(conf/(collection\.yaml|contract\.py)|services/(api|db)/(conf/collection\.yaml|app/contract\.py))$
